<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Chẩn đoán quét mã QR thẻ căn cước</title>
<style>
  :root{--nen:#f2f4f6;--the:#fff;--chu:#1b2430;--mo:#9aa3ad;--vien:#e9edf1;
        --xanh:#12b76a;--xanh-dam:#0e9257;--tot:#0f7a3d;--tot-nen:#e7f7ee;
        --loi:#b3261e;--loi-nen:#fdeceb;--canh:#8a6300;--canh-nen:#fff6e0}
  *{box-sizing:border-box}
  body{margin:0;background:var(--nen);color:var(--chu);
       font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
  .boc{max-width:760px;margin:0 auto;padding:0 0 40px}
  .dau{background:var(--the);text-align:center;padding:18px 16px;border-bottom:1px solid var(--vien)}
  .dau h1{margin:0;font-size:18px}
  .dau p{margin:4px 0 0;font-size:13px;color:var(--mo)}
  .khoi{background:var(--the);margin-top:10px;border-top:1px solid var(--vien);border-bottom:1px solid var(--vien);padding:14px 16px}
  .nut{display:block;width:calc(100% - 28px);margin:14px;padding:15px;font-size:16px;font-weight:600;
       font-family:inherit;border:0;border-radius:9px;background:var(--xanh);color:#fff;cursor:pointer}
  .nut:active{background:var(--xanh-dam)}
  .nut[disabled]{opacity:.5}
  .nut.phu{background:#eceff3;color:var(--chu)}
  .the-kq{border-radius:10px;padding:13px 15px;margin:10px 14px 0;border:1px solid;font-size:14px}
  .the-kq.tot{background:var(--tot-nen);border-color:#a9d9bb}
  .the-kq.xau{background:var(--loi-nen);border-color:#f0b3ae}
  .the-kq > b:first-child{display:block;font-size:15.5px;margin-bottom:4px}
  .the-kq .ndung{margin-top:7px;padding:8px 10px;background:rgba(255,255,255,.75);border-radius:7px;
       font-family:ui-monospace,Consolas,monospace;font-size:12px;word-break:break-all;line-height:1.5}
  table{width:100%;border-collapse:collapse;font-size:12.5px;margin-top:8px}
  th,td{text-align:left;padding:6px 8px;border-bottom:1px solid #eef1f4;vertical-align:top}
  th{color:var(--mo);font-weight:600;font-size:11.5px;text-transform:uppercase;letter-spacing:.4px}
  td.ok{color:var(--tot);font-weight:700}
  td.no{color:var(--mo)}
  .tt{padding:12px 16px;font-size:13.5px;color:var(--mo)}
  .canh-bao{background:var(--canh-nen);color:#6b4e00;padding:11px 16px;font-size:13px;line-height:1.5}
  .an{display:none}
</style>
</head>
<body>
<div class="boc">

<div class="dau">
  <h1>Chẩn đoán quét mã QR</h1>
  <p>Xem thẻ nào đọc được, đọc ở vùng nào, bằng bộ giải nào</p>
</div>

<div class="canh-bao">
  Ảnh <b>không rời khỏi máy này</b>. Mọi việc giải mã chạy ngay trong trình duyệt,
  không có gì được tải lên đâu cả.
</div>

<input type="file" id="tep" accept="image/*" multiple class="an">
<button type="button" class="nut" id="nut_chon">Chọn ảnh thẻ để thử</button>
<button type="button" class="nut phu" id="nut_xoa">Xoá kết quả</button>

<div class="tt" id="tt"></div>
<div id="kq"></div>

</div>

<script src="https://unpkg.com/jsqr@1.4.0/dist/jsQR.js"></script>
<!-- ZXing bản WASM — CHÍNH BỘ MÃ C++ mà Zalo dùng, biên dịch sang WebAssembly.
     Đã BỎ html5-qrcode (ZXing viết lại bằng JavaScript): đo trên 4 ảnh thẻ thật
     ngày 01/09 thì bản JavaScript đọc được 0/4, bản WASM đọc 4/4 và nhanh gấp ~20 lần. -->
<script src="https://unpkg.com/zxing-wasm@3.1.3/dist/iife/reader/index.js"></script>
<div id="anhtam" style="display:none"></div>
<script>
/* ============================================================================
 * BỘ ĐỌC MÃ QR THẺ CĂN CƯỚC — bản 3.2
 *
 * Bản 3.2 (01/09) đổi BỘ GIẢI, không phải đổi cách dò.
 * Dương gửi 4 ảnh thẻ mà Zalo đọc được còn trang thì không. Đo lại trên đúng thuật toán
 * của trang: bản 3.1 đọc được 1/4, mỗi ca trượt ngồi dò 17–25 giây rồi mới chịu thua.
 *
 * Nguyên nhân gốc: `html5-qrcode` là ZXing VIẾT LẠI BẮNG JAVASCRIPT, yếu hơn hẳn bản
 * C++ gốc mà Zalo dùng. Đo thật: cắt sát ô mã rồi đưa cho nó ở 24 cỡ × 5 chế độ khác
 * nhau, thẻ Đặng Thành Luân vẫn 0/120 lượt. Cùng tấm ảnh đó, ZXing bản WASM đọc
 * được. Không phải dò sai chỗ — là đưa đúng chỗ mà bộ giải không đủ khoẻ.
 *
 *   Bản 3.1 (html5-qrcode)  : 1/4 thẻ · 17–25 giây mỗi ca trượt
 *   Bản 3.2 (ZXing-WASM)    : 4/4 thẻ · chậm nhất 4,6 giây · 2/4 xong trong 0,1 giây
 *
 * Bản WASM còn rẻ tới mức (~40ms/lượt thay vì ~1,1 giây) nên không phải để dành nó
 * cho một chặng riêng nữa: nay nó chạy ở MỌI lượt, ngay cạnh jsQR.
 *
 * ---------------------------------------------------------------------------
 * Bản 3.0 (29/08) đưa số thẻ đọc được từ 1/7 lên 6/7 trên máy tính và Android,
 * nhưng iPhone thì trượt sạch. Ba chỗ, cả ba chỉ hỏng trên Safari của iOS:
 *
 *   1. MỖI LƯỢT DÒ TẠO MỘT CANVAS MỚI — một ảnh khó tốn tới ~65 lượt, mỗi canvas
 *      1100×1100 chiếm 4,8 MB, cộng lại hơn 300 MB. Safari trên iOS có TRẦN BỘ NHỚ
 *      CANVAS cứng (khoảng 224 MB); vượt trần thì canvas trả về TRẮNG TRƠN chứ không
 *      báo lỗi — nên mọi lượt sau đó đọc trượt hết mà không ai biết vì sao.
 *      Chrome trên máy tính và Android không có trần này nên vẫn chạy ngon.
 *      → Nay DÙNG LẠI đúng MỘT canvas cho mọi lượt.
 *
 *   2. LÀM MỜ BẰNG ctx.filter — Safari mãi tới bản 17.0 mới có `filter` cho canvas.
 *      Trên iOS cũ hơn, hai chế độ "mượt" lặng lẽ không làm gì, thành ra trùng
 *      với hai chế độ khác: mất 2 trong 5 nước cờ mà không hay.
 *      → Nay tự làm mờ bằng tay trên mảng xám, chạy được ở mọi trình duyệt.
 *
 *   3. createImageBitmap KHÔNG CÓ ĐƯỜNG LUI — Safari mới có từ bản 15, mà lỗi thì
 *      bị `.catch` nuốt trọn, trả về chuỗi rỗng y như "không đọc được".
 *      → Nay hỏng thì lùi về thẻ <img> thường, vẫn chạy.
 *
 * ---------------------------------------------------------------------------
 * Vì sao phải viết lại từ 3.0: bản 2.x dò 9 ô theo TỈ LỆ ẢNH (ảnh dọc → ô dọc dài
 * ngoẵng, ô mã chỉ chiếm một góc nhỏ trong đó nên bộ giải mù), và tệ hơn: hễ máy có
 * sẵn BarcodeDetector là nó BỎ LUÔN thư viện ZXing — trên Android chỉ còn MỘT bộ giải.
 *
 * Bốn chặng, rẻ trước đắt sau, ra kết quả là dừng:
 *   Chặng 0 — đưa THẮNG tệp ảnh gốc cho ZXing-WASM. Không canvas, không thu nhỏ,
 *             không cắt vùng. Đo thật: 2/4 thẻ xong ngay ở đây trong ~40–110ms.
 *             Đây cũng là đường an toàn nhất cho iPhone: không đụng canvas thì
 *             không bao giờ chạm trần bộ nhớ canvas của Safari.
 *   Chặng 1 — nguyên ảnh qua canvas, 2 chế độ. Cứu ca WASM chưa tải kịp và ca
 *             phải đổi cách xám hoá mới đọc được.
 *   Chặng A — DÒ Ô ĐỊNH VỊ (finder pattern 1:1:3:1:1) để biết mã nằm ĐÂU, rồi cắt sát
 *             quanh đó. Đây là cách máy quét thật vẫn làm. Đo trên ảnh thật: chỉ giải
 *             được khi ô mã chiếm ≥ ~50% khung cắt.
 *   Chặng C — quét lưới Ô VUÔNG toàn ảnh, phòng khi dò mốc trượt.
 *
 * Mỗi lượt ở chặng 1/A/C chạy ba bộ giải nối tiếp:
 *   jsQR (~10ms) → ZXing-WASM (~40ms) → bộ giải sẵn của máy (Android: ML Kit của Google).
 *
 * Mỗi vùng thử lần lượt 5 cách xử lý ảnh:
 *   gốc · kênh sáng nhất · mượt+sáng nhất · ngưỡng cục bộ · mượt+cục bộ
 * "Kênh sáng nhất" = lấy max(R,G,B) thay cho xám thường: nền bảo an thẻ căn cước
 * in màu xanh lơ, xám thường bóp tương phản mã xuống, max(R,G,B) thì không.
 * "Mượt" = làm nhoè nhẹ, cứu các thẻ đã mòn/rỗ mặt.
 *
 * TOÀN BỘ chạy trong máy người dùng, ảnh KHÔNG rời khỏi máy (NĐ 356/2025).
 * ========================================================================== */

/**
 * HẠN GIỜ CỨNG. Không có nó thì ảnh không đọc nổi sẽ dò hết mọi vùng × mọi chế độ —
 * đo thật: quá 10 phút mới chịu thua, cộng tác viên tưởng máy treo và tắt trang.
 * Đo trên ảnh thẻ thật: ca đọc được chậm nhất mất ~14 giây, nên để 25 giây là
 * vừa rộng cho ca khó mà vẫn dừng sớm để người dùng còn kịp chụp lại hoặc điền tay.
 */
var QR_HAN_GIO_MS = 25000;

/** 5 cách xử lý ảnh trước khi giải, xếp từ rẻ tới đắt. */
var CHE_DO_QR = [
  { ten: 'gốc',            xam: 0, mo: 0, cucbo: 0 },
  { ten: 'kênh sáng nhất', xam: 1, mo: 0, cucbo: 0 },
  { ten: 'mượt+sáng nhất', xam: 1, mo: 1, cucbo: 0 },
  { ten: 'ngưỡng cục bộ',  xam: 1, mo: 0, cucbo: 1 },
  { ten: 'mượt+cục bộ',    xam: 1, mo: 1, cucbo: 1 }
];

/**
 * HAI canvas dùng chung cho cả phiên, KHÔNG bao giờ tạo thêm.
 * Đây là chỗ chữa lỗi iPhone: gán lại width/height vừa xoá sạch canvas vừa trả lại
 * vùng nhớ cũ, nên dù dò 65 lượt thì lúc nào cũng chỉ có hai canvas sống.
 */
var QR_KHUNG = null, QR_KHUNG_MOC = null;

function layKhung_(kho, W, H) {
  var c = kho || document.createElement('canvas');
  c.width = W; c.height = H;              // gán lại = xoá sạch + trả vùng nhớ cũ
  return c;
}
/** Trả lại vùng nhớ khi dò xong — iPhone giữ backing store lâu hơn máy khác. */
function traKhung_() {
  if (QR_KHUNG) { QR_KHUNG.width = 1; QR_KHUNG.height = 1; }
  if (QR_KHUNG_MOC) { QR_KHUNG_MOC.width = 1; QR_KHUNG_MOC.height = 1; }
}

/**
 * Làm mờ nhẹ bằng tay (hộp 3×3, tách ngang rồi dọc) trên mảng xám.
 * Thay cho ctx.filter='blur()' vì Safari dưới bản 17 không có filter cho canvas.
 * Tự làm thì chạy giống hệt nhau ở mọi máy — đỡ phải đoán máy nào hỗ trợ gì.
 */
function moMang_(g, W, H) {
  var tam = new Uint8Array(W * H), x, y, k, s, n, i;
  for (y = 0; y < H; y++) {
    i = y * W;
    for (x = 0; x < W; x++) {
      s = 0; n = 0;
      for (k = -1; k <= 1; k++) { var xx = x + k; if (xx >= 0 && xx < W) { s += g[i + xx]; n++; } }
      tam[i + x] = s / n;
    }
  }
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      s = 0; n = 0;
      for (k = -1; k <= 1; k++) { var yy = y + k; if (yy >= 0 && yy < H) { s += tam[yy * W + x]; n++; } }
      g[y * W + x] = s / n;
    }
  }
}

/**
 * Cắt vùng {sx,sy,sw,sh} rồi đưa cạnh dài về v.norm điểm ảnh (phóng to HOẶC thu nhỏ).
 * Phóng to không tạo thêm chi tiết, nhưng khi ảnh nằm sát ngưỡng thì nó giúp
 * bộ giải bắt được lưới ô.
 */
function veVung_(A, v, che) {
  var r = v.norm / Math.max(v.sw, v.sh);
  var W = Math.max(1, Math.round(v.sw * r)), H = Math.max(1, Math.round(v.sh * r));
  var c = QR_KHUNG = layKhung_(QR_KHUNG, W, H);
  var ctx = c.getContext('2d', { willReadFrequently: true });
  ctx.imageSmoothingEnabled = true;
  ctx.imageSmoothingQuality = 'high';
  ctx.drawImage(A.ve, v.sx, v.sy, v.sw, v.sh, 0, 0, W, H);
  if (!che || (!che.xam && !che.cucbo && !che.mo)) return c;

  var d = ctx.getImageData(0, 0, W, H), a = d.data, i, p;
  var g = new Uint8Array(W * H);
  for (i = 0; i < W * H; i++) {
    p = i * 4;
    g[i] = che.xam ? Math.max(a[p], a[p + 1], a[p + 2])
                   : (a[p] * 0.299 + a[p + 1] * 0.587 + a[p + 2] * 0.114) | 0;
  }
  if (che.mo) moMang_(g, W, H);
  if (che.cucbo) {
    // Ngưỡng riêng cho từng khối 16×16: một góc bị loá, một góc trong bóng râm
    // thì ngưỡng chung sẽ đẩy bên sáng thành trắng hết, bên tối thành đen hết.
    var bw = Math.ceil(W / 16), bh = Math.ceil(H / 16), bx, by, x2, y2, s, n, yy, xx, ng;
    for (by = 0; by < H; by += bh) for (bx = 0; bx < W; bx += bw) {
      x2 = Math.min(bx + bw, W); y2 = Math.min(by + bh, H); s = 0; n = 0;
      for (yy = by; yy < y2; yy++) for (xx = bx; xx < x2; xx++) { s += g[yy * W + xx]; n++; }
      ng = n ? s / n : 128;
      for (yy = by; yy < y2; yy++) for (xx = bx; xx < x2; xx++) {
        p = (yy * W + xx) * 4;
        a[p] = a[p + 1] = a[p + 2] = g[yy * W + xx] > ng - 3 ? 255 : 0;
      }
    }
  } else {
    for (i = 0; i < W * H; i++) { p = i * 4; a[p] = a[p + 1] = a[p + 2] = g[i]; }
  }
  ctx.putImageData(d, 0, 0);
  return c;
}

/**
 * Dò Ô ĐỊNH VỊ của mã QR — ba ô vuông to ở ba góc mã, quét ngang hay quét dọc
 * qua tâm chúng đều cho dãy đen-trắng-đen-trắng-đen theo tỉ lệ 1:1:3:1:1.
 * Không dấu hiệu nào khác trên thẻ có tỉ lệ này, nên đây là cách tìm mã đáng tin nhất.
 * Chạy trên bản thu nhỏ (900 hoặc 1200 điểm ảnh) nên chỉ tốn ~50–80 mili giây.
 */
function doMoc_(A, coQuet) {
  var W = A.W, H = A.H;
  var w = Math.min(coQuet || 900, W), h = Math.max(1, Math.round(H * w / W)), ti = W / w;
  var c = QR_KHUNG_MOC = layKhung_(QR_KHUNG_MOC, w, h);
  var x = c.getContext('2d', { willReadFrequently: true });
  x.imageSmoothingEnabled = true; x.imageSmoothingQuality = 'high';
  x.drawImage(A.ve, 0, 0, w, h);
  var a = x.getImageData(0, 0, w, h).data, g = new Uint8Array(w * h), i, p, yy, xx;
  for (i = 0; i < w * h; i++) { p = i * 4; g[i] = Math.max(a[p], a[p + 1], a[p + 2]); }

  var bw = Math.ceil(w / 20), bh = Math.ceil(h / 20), bn = new Uint8Array(w * h);
  for (var by = 0; by < h; by += bh) for (var bx = 0; bx < w; bx += bw) {
    var X2 = Math.min(bx + bw, w), Y2 = Math.min(by + bh, h), s = 0, n = 0;
    for (yy = by; yy < Y2; yy++) for (xx = bx; xx < X2; xx++) { s += g[yy * w + xx]; n++; }
    var ng = n ? s / n : 128;
    for (yy = by; yy < Y2; yy++) for (xx = bx; xx < X2; xx++) bn[yy * w + xx] = g[yy * w + xx] < ng - 2 ? 1 : 0;
  }

  function hop(r) {                       // r = 5 độ dài dải liên tiếp, bắt đầu bằng ĐEN
    var t = r[0] + r[1] + r[2] + r[3] + r[4];
    if (t < 7) return 0;
    var m = t / 7, sai = m * 0.6;
    return (Math.abs(m - r[0]) < sai && Math.abs(m - r[1]) < sai && Math.abs(3 * m - r[2]) < 3 * sai &&
            Math.abs(m - r[3]) < sai && Math.abs(m - r[4]) < sai) ? m : 0;
  }
  var diem = [];
  function quet(ngang) {
    var L = ngang ? h : w, K = ngang ? w : h, u, v;
    for (u = 0; u < L; u += 2) {
      var r = [0, 0, 0, 0, 0], mau = 0;
      for (v = 0; v < K; v++) {
        var val = ngang ? bn[u * w + v] : bn[v * w + u];
        if (val === mau) { r[4]++; }
        else {
          if (mau === 1) {
            var m = hop(r);
            if (m) {
              var tam = v - r[4] - r[3] - r[2] / 2;
              diem.push(ngang ? { x: tam, y: u, m: m } : { x: u, y: tam, m: m });
            }
          }
          r = [r[1], r[2], r[3], r[4], 1]; mau = val;
        }
      }
    }
  }
  quet(true); quet(false);

  var cum = [];                            // gộp các lần bắt trúng cùng một ô định vị
  diem.forEach(function (d) {
    for (var k = 0; k < cum.length; k++) {
      var q = cum[k];
      if (Math.abs(q.x - d.x) < d.m * 2.5 && Math.abs(q.y - d.y) < d.m * 2.5 && Math.abs(q.m - d.m) < d.m * 0.6) {
        q.x = (q.x * q.n + d.x) / (q.n + 1); q.y = (q.y * q.n + d.y) / (q.n + 1);
        q.m = (q.m * q.n + d.m) / (q.n + 1); q.n++; return;
      }
    }
    cum.push({ x: d.x, y: d.y, m: d.m, n: 1 });
  });
  return cum.filter(function (q) { return q.n >= 3; })
            .sort(function (A2, B2) { return B2.n - A2.n; }).slice(0, 12)
            .map(function (q) { return { x: q.x * ti, y: q.y * ti, m: q.m * ti, n: q.n }; });
}

/** Từ các mốc dò được, dựng vùng cắt sát quanh mã. */
function vungTuMoc_(A) {
  // Dò ở HAI cỡ rồi gộp. Cỡ 900 rẻ và ăn ảnh thường; cỡ 1200 mới bắt được ô định vị
  // của mã nhỏ (đo thật: ảnh 1920×2560 có mã rộng 167 điểm ảnh, ở cỡ 900 mỗi ô vuông
  // chỉ còn 1,7 điểm nên dãy 1:1:3:1:1 nát). Chỉ dùng cỡ 1200 thì lại đổi thứ hạng cụm
  // và làm hỏng ảnh khác — nên gộp cả hai, cụm nào cả hai cỡ đều thấy thì tự khắc lên đầu.
  var W = A.W, H = A.H, nhom = [];
  var cum = doMoc_(A, 900);
  if (W > 1300) cum = cum.concat(doMoc_(A, 1200));
  cum.forEach(function (q) {                // ba ô định vị của cùng một mã nằm gần nhau
    for (var k = 0; k < nhom.length; k++) {
      var G = nhom[k];
      if (Math.abs(G.x - q.x) < q.m * 50 && Math.abs(G.y - q.y) < q.m * 50 && Math.abs(G.m - q.m) / G.m < 0.8) {
        G.x1 = Math.min(G.x1, q.x); G.y1 = Math.min(G.y1, q.y);
        G.x2 = Math.max(G.x2, q.x); G.y2 = Math.max(G.y2, q.y);
        G.x = (G.x1 + G.x2) / 2; G.y = (G.y1 + G.y2) / 2;
        G.m = (G.m * G.n + q.m * q.n) / (G.n + q.n); G.n += q.n; return;
      }
    }
    nhom.push({ x: q.x, y: q.y, x1: q.x, y1: q.y, x2: q.x, y2: q.y, m: q.m, n: q.n });
  });
  nhom.sort(function (X, Y) { return Y.n - X.n; });
  var ra = [];
  nhom.slice(0, 6).forEach(function (G, i) {
    var trai = Math.max(G.x2 - G.x1, G.y2 - G.y1);
    var nhieuMoc = trai > G.m * 10;
    var so = 0;
    function them(sx, sy, s) {
      if (s < 60) return;
      if (s > Math.min(W, H)) s = Math.min(W, H);
      ra.push({
        ten: 'mốc' + (i + 1) + '#' + so, dau: so === 0, norm: 1100,
        sx: Math.max(0, Math.min(W - s, Math.round(sx))),
        sy: Math.max(0, Math.min(H - s, Math.round(sy))),
        sw: s, sh: s
      });
      so++;
    }
    var co = [Math.round(G.m * 45), Math.round(G.m * 30), Math.round(G.m * 65)];
    if (nhieuMoc) co.unshift(Math.round(trai * 1.5));  // bắt được ≥2 mốc thì dùng luôn khoảng cách giữa chúng
    them(G.x - co[0] / 2, G.y - co[0] / 2, co[0]);

    // Chỉ bắt được MỘT ô định vị thì lấy nó làm tâm là sai: ô định vị nằm ở GÓC mã,
    // nên mã trải về một trong bốn hướng chéo. Đo trên ảnh thật (Đăng Thành Luân,
    // 1920×2560, mã rộng 167 điểm ảnh): bắt trúng ô định vị góc dưới-trái mà cắt lấy
    // tâm thì khung lệch hẳn khỏi mã. Nay thử cả bốn hướng, hết 4 lượt mà chắc ăn.
    if (!nhieuMoc && i < 1) {   // chỉ cụm mạnh nhất, thêm nữa thì chậm mà không cứu thêm ca nào
      var S = Math.round(G.m * 45 * 1.35), le = S * 0.18;
      [[1, 1], [-1, 1], [1, -1], [-1, -1]].forEach(function (h) {
        them(h[0] > 0 ? G.x - le : G.x + le - S,
             h[1] > 0 ? G.y - le : G.y + le - S, S);
      });
    }
    for (var j = 1; j < co.length; j++) them(G.x - co[j] / 2, G.y - co[j] / 2, co[j]);
  });
  return ra;
}

/**
 * Lưới ô VUÔNG (không theo tỉ lệ ảnh — đây chính là chỗ bản 2.x sai), cạnh = fr × chiều
 * rộng ảnh, chồng mép 50% nên mã nằm vắt qua ranh giới vẫn có một ô chứa trọn.
 * Xếp ô sát mép ngang lên trước vì mã căn cước luôn ở mép thẻ.
 */
function oVuong_(W, H, fr, norm) {
  var s = Math.floor(W * fr);
  if (s < 80) return [];
  if (s > Math.min(W, H)) s = Math.min(W, H);
  var b = Math.max(1, Math.floor(s * 0.5)), xs = [], ys = [], o = [], x, y;
  for (x = 0; x + s <= W; x += b) xs.push(x);
  if (xs[xs.length - 1] !== W - s) xs.push(W - s);
  for (y = 0; y + s <= H; y += b) ys.push(y);
  if (ys[ys.length - 1] !== H - s) ys.push(H - s);
  xs.forEach(function (X) {
    ys.forEach(function (Y) {
      var dx = Math.min(X, W - s - X) / W, dy = Math.abs((Y + s / 2) / H - 0.5);
      o.push({
        ten: 'ô' + fr + '(' + Math.round((X + s / 2) / W * 100) + ',' + Math.round((Y + s / 2) / H * 100) + ')',
        sx: X, sy: Y, sw: s, sh: s, norm: norm, uu: dx * 2 + dy
      });
    });
  });
  return o.sort(function (P, Q) { return P.uu - Q.uu; });
}

/** Kế hoạch quét lưới: đã gộp sẵn cặp {vùng, chế độ} theo đúng thứ tự sẽ thử. */
function keHoachLuoi_(W, H) {
  var ke = [], toan = { ten: 'toàn ảnh', sx: 0, sy: 0, sw: W, sh: H, norm: 1200 };
  ke.push({ v: toan, m: 0 }); ke.push({ v: toan, m: 1 });
  var t35 = oVuong_(W, H, 0.35, 1100), t55 = oVuong_(W, H, 0.55, 1100), t24 = oVuong_(W, H, 0.24, 900);
  [0, 1, 2, 3, 4].forEach(function (m) {
    var lim = m === 0 ? 18 : (m < 3 ? 14 : 8);
    [t35, t55, t24].forEach(function (ds) {
      for (var k = 0; k < ds.length && k < lim; k++) ke.push({ v: ds[k], m: m });
    });
  });
  return ke;
}

/** Bộ giải chạy bằng JavaScript, ăn thẳng ImageData nên rất nhanh (~0,1 giây). */
function thuJsQR_(c) {
  if (typeof jsQR === 'undefined') return '';
  try {
    var d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height);
    var r = jsQR(d.data, c.width, c.height, { inversionAttempts: 'attemptBoth' });
    return (r && r.data) ? r.data : '';
  } catch (e) { return ''; }
}

/** Bộ giải cài sẵn trong máy. Trên Android chính là ML Kit của Google — bộ Zalo dùng. */
function thuMayGiaiSan(nguon) {
  if (typeof BarcodeDetector === 'undefined' || typeof createImageBitmap === 'undefined') {
    return Promise.resolve('');
  }
  return createImageBitmap(nguon)
    .then(function (anh) {
      var may = new BarcodeDetector({ formats: ['qr_code'] });
      return may.detect(anh).then(function (ds) {
        try { anh.close(); } catch (e) {}
        return (ds && ds.length && ds[0].rawValue) ? ds[0].rawValue : '';
      });
    })
    .catch(function () { return ''; });
}

/* ----------------------------------------------------------------------------
 * ZXing bản WASM — CHÍNH bộ mã C++ mà Zalo dùng, biên dịch sang WebAssembly.
 *
 * Thay cho html5-qrcode (ZXing viết lại bằng JavaScript) từ 01/09/2026.
 * Đo trên 4 ảnh thẻ THẬT Dương gửi ngày 29/08 — cả 4 ảnh Zalo đọc được:
 *     bản JavaScript (html5-qrcode) : 0/4, mỗi lượt ~1,1 giây
 *     bản WASM                      : 4/4, mỗi lượt ~40 mili giây
 * Nhanh gấp ~25 lần nên không còn phải "để dành" nó cho một chặng riêng như bản 3.1:
 * nay nó chạy ở MỌI lượt, ngay cạnh jsQR.
 * -------------------------------------------------------------------------- */
var ZX_BAN = '3.1.3';
var zxSan = false, zxHong = false, zxCho = null;
// Chặng 0 có THẬT SỰ chạy được bộ giải hay không — chưa tải kịp thì còn được thử lại một lần.
var qrDaThuTep = false;

/**
 * Nạp bộ giải NGAY KHI MỞ TRANG, chạy nền, không chặn gì cả.
 * Tệp .wasm nặng ~1,1 MB — nghe thì to, nhưng nó tải trong lúc người dùng còn đang
 * chọn nhà máy và giơ máy chụp thẻ, nên tới lúc cần thì đã có sẵn. Bù lại đã bỏ
 * html5-qrcode nặng 330 KB. Tải hỏng cũng không sao: jsQR và bộ giải sẵn của máy
 * vẫn chạy, nút gõ tay 12 số luôn còn đó.
 */
function zxNap_() {
  if (zxCho) return zxCho;
  if (typeof ZXingWASM === 'undefined') { zxHong = true; return (zxCho = Promise.resolve(false)); }
  try {
    zxCho = ZXingWASM.prepareZXingModule({
      // Ghim tệp .wasm về CÙNG MỘT nhà (unpkg) với jsQR. Mặc định thư viện lấy ở
      // jsdelivr — thêm một nhà là thêm một chỗ hỏng, mà hỏng thì hỏng câm.
      overrides: {
        locateFile: function (t, p) {
          return /\.wasm$/.test(t)
            ? 'https://unpkg.com/zxing-wasm@' + ZX_BAN + '/dist/reader/' + t
            : p + t;
        }
      },
      fireImmediately: true
    }).then(function () { zxSan = true; return true; },
            function () { zxHong = true; return false; });
  } catch (e) { zxHong = true; zxCho = Promise.resolve(false); }
  return zxCho;
}
zxNap_();

// tryHarder: chịu khó dò lâu hơn · tryRotate: thẻ cầm nghiêng · tryInvert: ảnh âm bản
// · tryDownscale: tự thu nhỏ thử thêm vài cỡ (chính nó cứu ảnh chụp quá gần).
var ZX_TUY = {
  tryHarder: true, tryRotate: true, tryInvert: true, tryDownscale: true,
  formats: ['QRCode'], maxNumberOfSymbols: 1
};

function zxRa_(ds) { return (ds && ds.length && ds[0].text) ? ds[0].text : ''; }

/**
 * Giải THẲNG từ tệp ảnh gốc — không qua canvas, không thu nhỏ.
 * Đây vừa là đường nhanh nhất (2/4 ảnh xong ngay ở đây, ~40–110ms), vừa là đường
 * an toàn nhất cho iPhone: không đụng tới canvas thì không bao giờ chạm trần bộ nhớ
 * canvas của Safari — đúng cái bẫy đã làm hỏng bản 3.0.
 */
function thuWasmFile_(nguon) {
  return zxNap_().then(function (ok) {
    if (!ok) return '';
    qrDaThuTep = true;
    try { return ZXingWASM.readBarcodes(nguon, ZX_TUY).then(zxRa_, function () { return ''; }); }
    catch (e) { return ''; }
  });
}

/** Giải một vùng đã cắt ra canvas. Chưa nạp xong thì bỏ qua, đừng bắt cả dây chuyền đứng chờ. */
function thuWasmCanvas_(c) {
  if (!zxSan) return Promise.resolve('');
  var d;
  try { d = c.getContext('2d', { willReadFrequently: true }).getImageData(0, 0, c.width, c.height); }
  catch (e) { return Promise.resolve(''); }
  try { return ZXingWASM.readBarcodes(d, ZX_TUY).then(zxRa_, function () { return ''; }); }
  catch (e) { return Promise.resolve(''); }
}

/** Nhường luồng cho trình duyệt vẽ lại, khỏi treo màn hình khi dò lâu. */
function nhuong_() { return new Promise(function (ok) { setTimeout(ok, 0); }); }

/**
 * Nạp ảnh thành thứ vẽ được lên canvas.
 * Ưu tiên createImageBitmap (nhanh, giải nén sẵn); Safari cũ không có hoặc lỗi thì
 * LÙI VỀ thẻ <img> thường — trước đây chỗ này hỏng là hỏng câm, iPhone đời cũ chịu chết.
 */
function napAnh_(nguon) {
  function quaImg() {
    return new Promise(function (ok, hong) {
      var u = URL.createObjectURL(nguon), im = new Image();
      im.onload = function () {
        ok({ ve: im, W: im.naturalWidth || im.width, H: im.naturalHeight || im.height,
             dong: function () { try { URL.revokeObjectURL(u); } catch (e) {} } });
      };
      im.onerror = function () { try { URL.revokeObjectURL(u); } catch (e) {} hong(new Error('hỏng ảnh')); };
      im.src = u;
    });
  }
  if (typeof createImageBitmap === 'undefined') return quaImg();
  return createImageBitmap(nguon).then(function (b) {
    return { ve: b, W: b.width, H: b.height, dong: function () { try { b.close(); } catch (e) {} } };
  }).catch(quaImg);
}

/** Một dòng chẩn đoán — để Dương chụp màn hình gửi lại khi máy nào đó vẫn không đọc được. */
function qrMoiTruong_() {
  var coLoc = false;
  try {
    var c = document.createElement('canvas'); c.width = c.height = 8;
    var x = c.getContext('2d'); x.filter = 'blur(1px)';
    coLoc = !!(x.filter && x.filter !== 'none');
  } catch (e) {}
  return 'ảnh:' + (typeof createImageBitmap !== 'undefined' ? 'bitmap' : 'img') +
         ' · máy giải sẵn:' + (typeof BarcodeDetector !== 'undefined' ? 'có' : 'không') +
         ' · jsQR:' + (typeof jsQR !== 'undefined' ? 'có' : 'KHÔNG') +
         ' · ZXing-WASM:' + (zxSan ? 'sẵn sàng'
              : typeof ZXingWASM === 'undefined' ? 'KHÔNG TẢI ĐƯỢC'
              : zxHong ? 'HỎNG' : 'đang tải') +
         ' · lọc canvas:' + (coLoc ? 'có' : 'không');
}

/**
 * Chờ bộ giải WASM tối đa `han` mili giây rồi đi tiếp — KHÔNG đứng chờ vô hạn.
 * Ở cổng nhà máy sóng có thể yếu, tệp .wasm 1,1 MB về chậm; bắt cộng tác viên nhìn
 * màn hình đứng im là họ tắt trang. Chờ hụt cũng không mất gì: jsQR chạy ngay được,
 * và khi WASM về tới nơi thì các lượt sau tự khắc dùng nó.
 */
function thuWasmFileHan_(nguon, han) {
  if (typeof ZXingWASM === 'undefined' || zxHong) return Promise.resolve('');
  if (zxSan) return thuWasmFile_(nguon);
  return new Promise(function (ok) {
    var da = false;
    var h = setTimeout(function () { if (!da) { da = true; ok(''); } }, han);
    zxNap_().then(function (s) {
      if (da) return;
      clearTimeout(h); da = true;
      ok(s ? thuWasmFile_(nguon) : '');
    }, function () { if (!da) { clearTimeout(h); da = true; ok(''); } });
  });
}

/**
 * Cửa chính: nhận File/Blob, trả về chuỗi trong mã QR (hoặc '' nếu chịu thua).
 * baoBuoc(chuỗi) được gọi cách quãng để hiện tiến độ cho người dùng.
 */
function giaiMaTuNguon(nguon, baoBuoc) {
  qrDaThuTep = false;
  // CHẶNG 0 — đưa THẲNG tệp ảnh gốc cho ZXing-WASM.
  // Không canvas, không thu nhỏ, không cắt vùng. Vừa nhanh nhất (~40–110ms), vừa là
  // đường an toàn nhất cho iPhone: không đụng canvas thì không bao giờ chạm trần bộ nhớ
  // canvas của Safari. Đo trên 4 ảnh thẻ thật: 2/4 xong ngay tại đây.
  if (baoBuoc) baoBuoc('Đang đọc nguyên ảnh…');
  return thuWasmFileHan_(nguon, 2500).then(function (t0) {
    if (t0) return t0;
    return napAnh_(nguon).then(function (A) {
      var vm = vungTuMoc_(A);
      var ke = keHoachLuoi_(A.W, A.H);
      var tong = Math.min(vm.length, 10) * 3 + ke.length + 1;
      var dem = 0, batDau = Date.now(), daThuTep = qrDaThuTep;

      function conGio() { return Date.now() - batDau < QR_HAN_GIO_MS; }
      function xong(t) { try { A.dong(); } catch (e) {} traKhung_(); return t; }
      function tien(nhan) {
        dem++;
        // Chỉ vẽ lại tiến độ cách quãng: cập nhật từng lượt làm trình duyệt dựng lại
        // bố cục liên tục, tự nó ngốn nhiều thời gian hơn cả việc giải mã.
        if (baoBuoc && dem % 4 === 1) baoBuoc('Đang dò ' + nhan + ' (' + dem + '/' + tong + ')');
      }
      function nghi() { return dem % 15 === 0 ? nhuong_() : Promise.resolve(); }

      /**
       * Một lượt: jsQR (~10ms) → ZXing-WASM (~40ms) → bộ giải sẵn của máy (Android: ML Kit).
       * Bản 3.1 phải để ZXing riêng ra một chặng cuối vì bản JavaScript tốn ~1,1 giây mỗi
       * lượt, chạy khắp nơi thì không kịp. Bản WASM rẻ tới mức cho chạy ở MỌI lượt —
       * và chính nó là bộ đọc được cả 4 thẻ khó.
       */
      function luot(v, che, tiep) {
        tien(v.ten);
        var c = veVung_(A, v, che);
        var t = thuJsQR_(c);
        if (t) return Promise.resolve(t);
        return thuWasmCanvas_(c).then(function (t2) {
          if (t2) return t2;
          return thuMayGiaiSan(c).then(function (t3) {
            return t3 || nghi().then(tiep);
          });
        });
      }

      // Chặng 1 — nguyên ảnh qua canvas, 2 chế độ. Cứu ca WASM chưa tải kịp,
      // và ca ảnh cần đổi cách xám hoá (nền bảo an xanh lơ) mới đọc được.
      function chang1(k) {
        if (k >= 2 || k >= ke.length) return thuLaiTep();
        return luot(ke[k].v, CHE_DO_QR[ke[k].m], function () { return chang1(k + 1); });
      }
      // Nếu lúc mở màn WASM chưa về kịp thì tới đây nó thường đã về — thử lại đường
      // "thẳng từ tệp" đúng MỘT lần, vì đó là đường khoẻ nhất trong cả dây chuyền.
      function thuLaiTep() {
        if (daThuTep || !zxSan) return changA(0, 0);
        daThuTep = true;
        tien('nguyên tệp ảnh');
        return thuWasmFile_(nguon).then(function (t) { return t || changA(0, 0); });
      }
      // Chặng A — vùng suy ra từ ô định vị (finder pattern), 3 chế độ rẻ nhất
      function changA(m, k) {
        if (m >= 3 || !conGio()) return changC(2);
        if (k >= vm.length || k >= 10) return changA(m + 1, 0);   // 10 = cụm 1 (7 vùng) + 3 vùng của cụm 2
        return luot(vm[k], CHE_DO_QR[m], function () { return changA(m, k + 1); });
      }
      // Chặng C — quét lưới ô vuông toàn ảnh, phòng khi dò mốc trượt.
      // `ke` đã xếp sẵn rẻ trước đắt sau (hết chế độ 0 mới sang chế độ 1…) nên
      // không phải cắt làm hai đoạn như bản 3.1 nữa.
      function changC(k) {
        if (k >= ke.length || !conGio()) return '';
        return luot(ke[k].v, CHE_DO_QR[ke[k].m], function () { return changC(k + 1); });
      }
      return chang1(0).then(xong, function () { return xong(''); });
    });
  }).catch(function () { traKhung_(); return ''; });
}

/* ---- Phần chỉ có ở trang chẩn đoán: ghi lại VẾT từng lượt thử ---- */
var QR_VET = [];
(function bocVet() {
  var jsCu = thuJsQR_, mayCu = thuMayGiaiSan, zxCu = thuWasmCanvas_,
      tepCu = thuWasmFile_, veCu = veVung_;
  var nhan = { vung: '?', cheDo: '?' };
  veVung_ = function (A, v, che) {
    nhan = { vung: v.ten, cheDo: (che && che.ten) || 'gốc' };
    return veCu(A, v, che);
  };
  function ghi(bo, ra, ms) {
    QR_VET.push({ vung: nhan.vung, cheDo: nhan.cheDo, bo: bo, ra: !!ra, ms: ms });
  }
  thuJsQR_ = function (c) { var t0 = Date.now(), r = jsCu(c); ghi('jsQR', r, Date.now() - t0); return r; };
  thuMayGiaiSan = function (n) {
    if (typeof BarcodeDetector === 'undefined') return Promise.resolve('');
    var t0 = Date.now();
    return mayCu(n).then(function (r) { ghi('máy giải sẵn', r, Date.now() - t0); return r; });
  };
  thuWasmCanvas_ = function (c) {
    var t0 = Date.now();
    return zxCu(c).then(function (r) { ghi('ZXing-WASM', r, Date.now() - t0); return r; });
  };
  thuWasmFile_ = function (n) {
    nhan = { vung: 'nguyên tệp ảnh', cheDo: 'không qua canvas' };
    var t0 = Date.now();
    return tepCu(n).then(function (r) { ghi('ZXing-WASM', r, Date.now() - t0); return r; });
  };
})();


function thoat(s) {
  return String(s == null ? '' : s).replace(/[<>&]/g, function (m) {
    return { '<': '&lt;', '>': '&gt;', '&': '&amp;' }[m];
  });
}

/** Chạy thử một ảnh, trả về bản báo cáo đầy đủ. */
function chayMot(nguon, ten) {
  QR_VET = [];
  var t0 = Date.now(), kt = '?';
  return napAnh_(nguon)
    .then(function (A) { kt = A.W + '\u00d7' + A.H; try { A.dong(); } catch (e) {} })
    .catch(function () {})
    .then(function () { return giaiMaTuNguon(nguon, function () {}); })
    .then(function (ra) {
      var trung = null;
      for (var i = 0; i < QR_VET.length; i++) if (QR_VET[i].ra) { trung = QR_VET[i]; break; }
      return { ten: ten, kich_thuoc: kt, ms: Date.now() - t0, so_lan: QR_VET.length,
               ra: !!ra, noi_dung: ra || '', trung: trung, vet: QR_VET.slice() };
    });
}

function veBaoCao(b) {
  var d = document.createElement('div');
  d.className = 'the-kq ' + (b.ra ? 'tot' : 'xau');
  var h = '<b>' + (b.ra ? '✓ ĐỌC ĐƯỢC' : '✗ KHÔNG ĐỌC ĐƯỢC') + ' — ' + thoat(b.ten) + '</b>' +
          'Ảnh ' + b.kich_thuoc + ' · thử ' + b.so_lan + ' lượt · ' + (b.ms / 1000).toFixed(1) + ' giây';
  if (b.trung) h += '<br>Trúng ở: <b>' + thoat(b.trung.vung) + '</b> · chế độ <b>' +
                    thoat(b.trung.cheDo) + '</b> · bộ giải <b>' + thoat(b.trung.bo) + '</b>';
  if (b.ra) {
    var p = b.noi_dung.split('|');
    h += '<div class="ndung">' + thoat(b.noi_dung) + '</div>';
    if (p.length >= 3) h += 'Số CCCD <b>' + thoat(p[0]) + '</b> · ' + thoat(p[2]);
  }
  h += '<table><tr><th>Vùng</th><th>Chế độ</th><th>Bộ giải</th><th>Kết quả</th><th>ms</th></tr>';
  b.vet.slice(0, 40).forEach(function (v) {
    h += '<tr><td>' + thoat(v.vung) + '</td><td>' + thoat(v.cheDo) + '</td><td>' +
         thoat(v.bo || '—') + '</td><td class="' + (v.ra ? 'ok' : 'no') + '">' +
         (v.ra ? 'RA' : '–') + '</td><td>' + v.ms + '</td></tr>';
  });
  h += '</table>';
  d.innerHTML = h;
  document.getElementById('kq').appendChild(d);
}

document.getElementById('tt').textContent = 'Máy này: ' + qrMoiTruong_();

document.getElementById('nut_chon').addEventListener('click', function () {
  document.getElementById('tep').click();
});
document.getElementById('nut_xoa').addEventListener('click', function () {
  document.getElementById('kq').innerHTML = '';
  document.getElementById('tt').textContent = '';
});

document.getElementById('tep').addEventListener('change', function () {
  var ds = [].slice.call(this.files || []);
  this.value = '';
  if (!ds.length) return;
  var i = 0, ok = 0;
  var tt = document.getElementById('tt');
  (function tiep() {
    if (i >= ds.length) {
      tt.innerHTML = '<b>Xong: ' + ok + '/' + ds.length + ' ảnh đọc được.</b>';
      return;
    }
    var f = ds[i];
    tt.textContent = 'Đang thử ' + (i + 1) + '/' + ds.length + ': ' + f.name;
    chayMot(f, f.name).then(function (b) {
      if (b.ra) ok++;
      veBaoCao(b);
      i++; tiep();
    });
  })();
});

/** Dùng cho việc kiểm thử tự động: window.thuURL('ten-anh.jpg') */
window.thuURL = function (url) {
  return fetch(url).then(function (r) { return r.blob(); })
    .then(function (b) { return chayMot(b, url); });
};
window.giaiMaTuNguon = giaiMaTuNguon;
</script>
